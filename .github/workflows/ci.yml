name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate Compose model
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build production API image
        run: docker build --tag resolveos-api:ci .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_AUTH0_DOMAIN: tenant.example.auth0.com
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_AUTH0_AUDIENCE: https://api.resolveos.dev
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build verification UI
        run: npm run build
      - name: Type-check verification UI
        run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
